/* ---------- drill-down sheets: a chart for each tile, plus ways to improve worked out from your numbers ---------- */
const tap = k => `data-detail="${k}" role="button" tabindex="0" aria-haspopup="dialog"`;
const ymKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
function hbars(rows, max){
  max = max || Math.max(1, ...rows.map(r => Math.max(r.value, r.mark || 0)));
  return `<div class="hbars">${rows.map(r => `<div class="hb"><div class="hb-l"><span>${esc(r.label)}${r.chip ? ` <span class="chip ${r.chipCls || ""}">${esc(r.chip)}</span>` : ""}</span><b class="num">${r.text}</b></div>
    <div class="bar ${r.cls || ""}"><i style="width:${Math.max(0, Math.min(100, r.value / max * 100))}%"></i>${r.mark != null ? `<em style="left:${Math.min(100, r.mark / max * 100)}%" title="Budget"></em>` : ""}</div></div>`).join("")}</div>`;
}
function colChart(vals, labels, color, fmtv){
  const W = 640, H = 210, pl = 54, pr = 10, pt = 14, pb = 26, max = Math.max(1, ...vals), bw = (W - pl - pr) / vals.length;
  let g = "";
  for (let t = 0; t <= 3; t++){ const y = pt + (H - pt - pb) * (1 - t / 3); g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${esc(fmtv(max * t / 3))}</text>`; }
  vals.forEach((v, i) => { const h = (H - pt - pb) * v / max;
    g += `<rect x="${pl + i*bw + bw*.18}" y="${H - pb - h}" width="${bw*.64}" height="${Math.max(0, h)}" rx="2" fill="${color}"/><text x="${pl + i*bw + bw/2}" y="${H-8}" text-anchor="middle">${esc(labels[i])}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly amounts">${g}</svg>`;
}
const tips = list => `<ol class="tips">${list.filter(Boolean).map(t => `<li><b>${t.t}</b><span>${t.b}</span>${t.a ? `<button class="btn" data-apply="${t.a.k}">${esc(t.a.label)}</button>` : ""}</li>`).join("")}</ol>`;
const sec = (title, body) => `<section class="sheet-sec"><div class="eyebrow">${title}</div>${body}</section>`;

function detailLeft(){
  const t = totals(), inc = t.income || 1;
  const saveCats = sum(S.expenses.filter(e => e.kind === "save"), e => e.budget);
  const parts = [["Needs", t.needs, "var(--accent)"], ["Wants", t.wants, "var(--warn)"], ["Savings", saveCats, "var(--good)"], ["Debt payments", t.debtPay, "var(--bad)"], ["Left over", Math.max(0, t.left), "var(--ink)"]];
  const stack = `<div class="stack">${parts.map(([n, v, c]) => v > 0 ? `<i style="flex:${v};background:${c}" title="${n}"></i>` : "").join("")}</div>
    <div class="row small">${parts.map(([n, v, c]) => `<span class="lg"><i style="background:${c}"></i>${n} <b class="num">${money(v)}</b> <span class="muted">${pct(v / inc * 100)}</span></span>`).join("")}</div>`;
  const cats = S.expenses.slice().sort((a, b) => num(b.spent) - num(a.spent)).map(e => ({ label:e.name, value:num(e.spent), mark:num(e.budget), text: money(num(e.spent)) + " / " + money(num(e.budget)), cls: num(e.spent) > num(e.budget) ? "over" : "" }));
  const over = S.expenses.filter(e => num(e.spent) > num(e.budget)).sort((a, b) => (num(b.spent) - num(b.budget)) - (num(a.spent) - num(a.budget)));
  const wants = S.expenses.filter(e => e.kind === "want").sort((a, b) => num(b.budget) - num(a.budget));
  const wp = t.wants / inc * 100;
  const base = simulate(S.debts, S.extraPayment, S.strategy);
  const boosted = t.left > 0 && S.debts.length ? simulate(S.debts, num(S.extraPayment) + t.left, S.strategy) : null;
  const L = [];
  if (t.left < 0) L.push({ t:`You're ${money(-t.left)} short each month.`, b:"Your budget and debt payments add up to more than your income. Trim wants first, then look at the biggest needs." });
  over.slice(0, 2).forEach(e => L.push({ t:`${esc(e.name)} is ${money(num(e.spent) - num(e.budget))} over budget.`, b:`You've spent ${money(num(e.spent))} of ${money(num(e.budget))}. Hold back for the rest of the month, or set a budget that matches real life.` }));
  if (wp > 30) L.push({ t:`Wants take ${pct(wp)} of your income.`, b:`Bringing them down to 30% frees ${money(t.wants - inc * 0.3)} a month.` });
  if (wants[0] && num(wants[0].budget) > 0) L.push({ t:`Trim ${esc(wants[0].name)} by a quarter.`, b:`That frees ${money(num(wants[0].budget) * 0.25)} a month, or ${money(num(wants[0].budget) * 3)} a year.` });
  if (boosted && !boosted.never && !base.never && base.months > boosted.months) L.push({ t:`Send the ${money(t.left)} left over to your debt.`, b:`You'd be debt-free ${base.months - boosted.months} months sooner (${monthLabel(addMonths(boosted.months))}) and pay ${money(base.totalInterest - boosted.totalInterest)} less interest.`, a:{ k:"extra:" + Math.round(t.left), label:"Add it to my debt payment" } });
  L.push({ t:"Pay yourself first.", b:"Set an automatic transfer to savings on payday, so the money moves before it gets spent." });
  return { title:"Left over this month · " + money(t.left), link:["#budget", "Open budget"],
    body: sec("Where your income goes", stack) + (cats.length ? sec("Spent vs budget · line marks the budget", hbars(cats)) : "") + sec("Ways to improve", tips(L)) };
}

function detailDebt(){
  if (!S.debts.length) return { title:"Total debt", body:`<p class="empty">No debts recorded.</p>`, link:["#debt", "Open payoff plan"] };
  const sim = simulate(S.debts, S.extraPayment, S.strategy), base = simulate(S.debts, 0, S.strategy);
  const bars = S.debts.slice().sort((a, b) => num(b.balance) - num(a.balance)).map(d => { const r = num(d.apr);
    return { label:d.name, value:num(d.balance), text:money(num(d.balance)), chip:pct(r) + " interest", chipCls: r >= 15 ? "bad" : r >= 8 ? "warn" : "good", cls: r >= 15 ? "over" : "" }; });
  const scen = [0, 50, 100, 250, 500].map(x => { const s = simulate(S.debts, num(S.extraPayment) + x, S.strategy);
    return `<tr><td>${x ? "+" + money(x) + " / month" : "Your plan now"}</td><td>${s.never ? "Never" : monthLabel(addMonths(s.months))}</td><td class="n num">${money(s.totalInterest)}</td><td class="n num pos">${x && !s.never && !sim.never ? money(sim.totalInterest - s.totalInterest) : "—"}</td></tr>`; }).join("");
  const monthlyInt = sum(S.debts, d => num(d.balance) * num(d.apr) / 1200);
  const top = S.debts.filter(d => num(d.balance) > 0).sort((a, b) => num(b.apr) - num(a.apr))[0];
  const L = [{ t:`Your debts cost ${money(monthlyInt)} in interest this month.`, b:`That's about ${money(monthlyInt * 12)} a year that buys you nothing. Every extra payment cuts it.` }];
  if (top && num(top.apr) > 5){ const cut = S.debts.map(d => d.id === top.id ? Object.assign({}, d, { apr: num(d.apr) - 5 }) : d); const s2 = simulate(cut, S.extraPayment, S.strategy);
    L.push({ t:`Ask for a lower rate on ${esc(top.name)}.`, b:`It charges ${pct(num(top.apr))}. Getting it 5 points lower would save about ${money(Math.max(0, sim.totalInterest - s2.totalInterest))}. Lenders often agree for customers who pay on time.` }); }
  if (S.strategy === "snowball"){ const av = simulate(S.debts, S.extraPayment, "avalanche"); if (av.totalInterest < sim.totalInterest - 1) L.push({ t:"Switch to avalanche.", b:`Paying the highest rate first saves ${money(sim.totalInterest - av.totalInterest)}.`, a:{ k:"strategy:avalanche", label:"Switch to avalanche" } }); }
  L.push({ t:`Pay ${money(100)} more a month.`, b:"The table above shows how much sooner you'd be free and how much interest you'd keep.", a:{ k:"extra:100", label:`Add ${money(100)} to my extra payment` } });
  L.push({ t:"Stop new debt while you clear the old.", b:"Remove saved cards from shopping sites, and keep a small emergency fund so surprises don't go on credit." });
  L.push({ t:"Consolidate only if it's cheaper.", b:"A consolidation loan or balance transfer helps only when the rate and fees are lower than what you pay now and the cards stay paid off." });
  return { title:"Total debt · " + money(sum(S.debts, d => d.balance)), link:["#debt", "Open payoff plan"],
    body: sec("Balance by debt", hbars(bars))
      + sec("Balance over time", lineChart([{ data:base.series, color:"var(--muted)", dash:true }, { data:sim.series, color:"var(--accent)", fill:true }], { label:"Debt balance", xl:i => monthLabel(addMonths(i)) }) + legend([["var(--accent)", "Your plan"], ["var(--muted)", "Minimum payments only", 1]]))
      + sec("What paying a bit more does", `<div class="tbl-wrap"><table><thead><tr><th>Extra</th><th>Debt-free</th><th class="n">Interest</th><th class="n">You save</th></tr></thead><tbody>${scen}</tbody></table></div>`)
      + sec("Ways to improve", tips(L)) };
}

function detailGoals(){
  if (!S.goals.length) return { title:"Saved toward goals", body:`<p class="empty">No goals yet.</p>`, link:["#goals", "Open goals"] };
  const all = S.goals.flatMap(g => g.contributions || []).filter(c => c.date).sort((a, b) => a.date.localeCompare(b.date));
  const target = sum(S.goals, g => g.target);
  let chart = `<p class="empty">Log a contribution to see your savings over time.</p>`;
  if (all.length){
    const start = new Date(all[0].date.slice(0, 7) + "-01T00:00:00"), n = Math.max(2, monthsBetween(ymd(start), todayISO()) + 1);
    const cum = [], labels = []; let run = 0;
    for (let i = 0; i < n; i++){ const d = new Date(start); d.setMonth(d.getMonth() + i); const k = ymKey(d);
      run += sum(all.filter(c => c.date.slice(0, 7) === k), c => c.amount); cum.push(run); labels.push(d.toLocaleDateString(undefined, { month:"short" })); }
    chart = lineChart([{ data:cum.map(() => target), color:"var(--muted)", dash:true }, { data:cum, color:"var(--good)", fill:true }], { label:"Saved over time", xl:i => labels[i] })
      + legend([["var(--good)", "Total saved"], ["var(--muted)", "All targets combined", 1]]);
  }
  const rows = S.goals.map(g => { const s = goalStats(g); return { label:g.name, value:s.p, text:money(s.saved) + " / " + money(s.target) + " · " + pct(s.p), chip: s.done ? "Reached" : null, chipCls:"good" }; });
  const t = totals(), L = [];
  S.goals.forEach(g => { const s = goalStats(g);
    if (s.done) L.push({ t:`${esc(g.name)} is reached.`, b:"Raise the target, or move its monthly amount to your next goal." });
    else if (s.perMonth !== null && s.avg < s.perMonth) L.push({ t:`${esc(g.name)}: add ${money(s.perMonth - s.avg)} more a month.`, b:`You need ${money(s.perMonth)} a month to reach ${money(s.target)} by ${fmtDate(g.deadline)}. You average ${money(s.avg)}${s.eta ? `, which gets you there around ${monthLabel(s.eta)}` : ""}. Add more, or move the date.` });
    else if (s.perMonth !== null) L.push({ t:`${esc(g.name)} is on pace.`, b:`At ${money(s.avg)} a month you'd finish around ${s.eta ? monthLabel(s.eta) : "soon"}, before your date of ${fmtDate(g.deadline)}.` }); });
  if (t.left > 0) L.push({ t:`Your budget has ${money(t.left)} unassigned.`, b:"Sending even half of it to your goals each month speeds them up a lot." });
  L.push({ t:"Automate it.", b:"A standing transfer on payday, set to the “needed per month” amount, keeps every goal on track without willpower." });
  L.push({ t:"Keep goal money separate.", b:"Hold your emergency fund in its own savings account that pays interest, so it doesn't get spent by accident." });
  return { title:"Saved toward goals · " + money(sum(S.goals, g => goalStats(g).saved)), link:["#goals", "Open goals"],
    body: sec("Savings over time", chart) + sec("Each goal", hbars(rows, 100)) + sec("Ways to improve", tips(L)) };
}

function detailDiv(){
  const ev = S.holdings.flatMap(h => upcomingEvents(h.symbol, num(h.shares)));
  const months = []; for (let i = 0; i < 12; i++){ const d = addMonths(i); months.push({ key:ymKey(d), label:d.toLocaleDateString(undefined, { month:"short" }), v:0 }); }
  ev.forEach(e => { const m = months.find(x => x.key === (e.pay || e.ex).slice(0, 7)); if (m) m.v += e.amount * e.shares; });
  const per = S.holdings.map(h => ({ label:h.symbol || "—", value:(divProfile(h.symbol)?.ttm || 0) * num(h.shares) })).filter(r => r.value > 0).map(r => Object.assign(r, { text:money(r.value, "USD", 2), cls:"gold" }));
  const totVal = sum(S.holdings, h => (priceOf(h.symbol)?.price || 0) * num(h.shares)), totDiv = sum(per, r => r.value), y = totVal ? totDiv / totVal : 0, fx = fxCached();
  const next = ev.filter(e => e.ex >= todayISO()).sort((a, b) => a.ex.localeCompare(b.ex))[0];
  const L = [];
  if (!totDiv) L.push({ t:"No dividend data yet.", b:"Add holdings on the Invest page, then press Refresh market data." });
  if (y > 0) L.push({ t:`To earn ${money(100, "USD")} a month at your ${pct(y * 100)} yield`, b:`you'd need about ${money(1200 / y, "USD")} invested. Each ${money(1000, "USD")} you add pays roughly ${money(1000 * y / 12, "USD", 2)} a month.` });
  if (next) L.push({ t:`Next ex-dividend date: ${esc(next.sym)} on ${fmtDate(next.ex)}.`, b:`Own the shares before that date to get the ${money(next.amount, "USD", 2)} per share payment${next.est ? " (date estimated)" : ""}.` });
  if (per.length && totDiv && Math.max(...per.map(r => r.value)) / totDiv > 0.5) L.push({ t:"Spread your income out.", b:"More than half your dividends come from one company. A dividend ETF, or a few more holdings in different sectors, means one cut can't hurt you as much." });
  L.push({ t:"Reinvest while you're building.", b:"Turning on dividend reinvestment (DRIP) at your broker buys more shares automatically, so payments compound." });
  L.push({ t:"Look for steady growers, not just high yields.", b:"A very high yield can mean the share price fell for a reason. Years of steady or rising payments are a better sign." });
  return { title:"Dividend income · " + money(totDiv, "USD") + " / yr", link:["#invest", "Open invest"],
    body: sec("Expected payments · next 12 months (USD)", colChart(months.map(m => m.v), months.map(m => m.label), "var(--gold)", v => money(v, "USD", 0))
        + `<p class="small muted" style="margin:0">Includes estimated dates.${fx && S.settings.currency !== "USD" ? " Total ≈ " + money(sum(months, m => m.v) * fx) + "." : ""}</p>`)
      + (per.length ? sec("By holding · per year", hbars(per)) : "") + sec("Ways to improve", tips(L)) };
}

function detailNet(){
  const t = totals(), fx = fxCached(), sim = simulate(S.debts, S.extraPayment, S.strategy);
  const gSaved = sum(S.goals, g => goalStats(g).saved), gAvg = sum(S.goals, g => goalStats(g).avg);
  const port = sum(S.holdings, h => (priceOf(h.symbol)?.price || 0) * num(h.shares)) * (fx || 0);
  const N = 36, debtS = [], assetS = [];
  for (let i = 0; i <= N; i++){ debtS.push(i < sim.series.length ? sim.series[i] : (sim.never ? sim.series[sim.series.length - 1] : 0)); assetS.push(gSaved + gAvg * i + port); }
  const cross = assetS.findIndex((a, i) => a >= debtS[i]);
  const L = [];
  if (assetS[0] < debtS[0]) L.push({ t: cross > 0 ? `You'll own more than you owe around ${monthLabel(addMonths(cross))}.` : "At this pace you'll still owe more than you own in 3 years.", b:`That assumes you keep paying debt as planned and saving ${money(gAvg)} a month toward goals.` });
  else L.push({ t:"You own more than you owe.", b:"Keep the gap growing: invest what used to go to debt." });
  if (S.debts.length) L.push({ t:"Debt is your biggest lever.", b:`Every amount you repay raises your net position by the same amount and stops its interest. Your debts cost about ${money(sum(S.debts, d => num(d.balance) * num(d.apr) / 1200))} a month in interest.` });
  if (S.debts.length && !sim.never) L.push({ t:"Keep the payment going after your last debt.", b:`From ${monthLabel(addMonths(sim.months))}, sending the ${money(t.debtPay)} you pay now into savings or investing adds about ${money(t.debtPay * 12)} a year, before any returns.` });
  L.push({ t:"Check in once a month.", b:"Update your balances on the same day each month. Watching the gap close keeps you going." });
  return { title:"Net position", link:null,
    body: sec("What you own vs what you owe · next 3 years", lineChart([{ data:debtS, color:"var(--bad)" }, { data:assetS, color:"var(--good)", fill:true }], { label:"Assets vs debt", xl:i => monthLabel(addMonths(i)) })
        + legend([["var(--good)", "Savings + shares"], ["var(--bad)", "Debt"]]) + `<p class="small muted" style="margin:0">Where green rises above red, you own more than you owe.</p>`)
      + sec("Ways to improve", tips(L)) };
}

const details = { left:detailLeft, debt:detailDebt, goals:detailGoals, div:detailDiv, net:detailNet };
let openKey = null, lastFocus = null;
function openDetail(k){
  const d = details[k]?.(); if (!d) return;
  if (!openKey) lastFocus = document.activeElement;
  openKey = k;
  document.getElementById("sheet-title").textContent = d.title;
  document.getElementById("sheet-body").innerHTML = d.body + (d.link ? `<div><a class="btn primary" href="${d.link[0]}" data-close>${esc(d.link[1])}</a></div>` : "");
  const sh = document.getElementById("sheet"), card = sh.querySelector(".sheet-card");
  if (sh.hidden){ sh.hidden = false; document.body.style.overflow = "hidden"; card.scrollTop = 0; card.focus(); }
}
function closeDetail(){
  const sh = document.getElementById("sheet"); if (sh.hidden) return;
  sh.hidden = true; openKey = null; document.body.style.overflow = "";
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
document.addEventListener("click", e => {
  const ap = e.target.closest("[data-apply]");
  if (ap){ const [k, v] = ap.dataset.apply.split(":");
    if (k === "extra") S.extraPayment = Math.round(num(S.extraPayment) + num(v));
    if (k === "strategy") S.strategy = v;
    save(); render(); openDetail(openKey); return; }
  if (e.target.closest("[data-close]")){ closeDetail(); return; }
  if (e.target.closest("[data-skin-next]")){ const ks = Object.keys(SKINS); setSkin(ks[(ks.indexOf(skinKey()) + 1) % ks.length], e); return; }
  const sk = e.target.closest("[data-skin-pick]"); if (sk){ setSkin(sk.dataset.skinPick, e); return; }
  const d = e.target.closest("[data-detail]");
  if (d && !e.target.closest("input,select,textarea,a,button")) openDetail(d.dataset.detail);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return closeDetail();
  const d = e.target.closest && e.target.closest("[data-detail]");
  if (d && e.target === d && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openDetail(d.dataset.detail); }
});

/* phone setup panel (Settings) */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function loadPhone(){
  const box = document.getElementById("phoneBox"); if (!box || !SERVER) return;
  try {
    const r = await fetch("api/info", { cache:"no-store" });
    if (!r.ok){ box.innerHTML = "Open the app on the PC itself, at <code>http://localhost:8765</code>, to see the phone link."; return; }
    const j = await r.json();
    if (!j.urls.length){ box.textContent = "This PC isn't on a network right now. Connect it to your Wi-Fi and reopen Settings."; return; }
    box.innerHTML = `<ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--ink)">
      <li>Connect your iPhone to the same Wi-Fi as this PC.</li><li>Point the iPhone camera at this code and tap the link (or type the link into Safari).</li><li>In Safari, tap Share, then <b>Add to Home Screen</b>.</li></ol>
      <div id="qr" style="background:#fff;padding:10px;border-radius:4px;width:max-content;margin-top:12px"></div>
      ${j.urls.map(u => `<code style="display:block;margin-top:8px;color:var(--accent);word-break:break-all">${esc(u)}</code>`).join("")}
      <p style="margin:8px 0 0">The link holds your private access key. Only open it on devices you own. The PC must be on, with the Freedom Ledger window open.</p>`;
    try { if (!window.QRCode) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js");
      new QRCode(document.getElementById("qr"), { text:j.urls[0], width:180, height:180, colorDark:"#050605", colorLight:"#ffffff" }); }
    catch(e){ document.getElementById("qr").hidden = true; }
  } catch(e){ box.textContent = "Couldn't reach the Freedom Ledger server on this PC."; }
}

/* ---------- render & events ---------- */
const views = { overview:viewOverview, budget:viewBudget, debt:viewDebt, goals:viewGoals, invest:viewInvest, setup:viewSettings };
function route(){ const h = location.hash.slice(1); return views[h] ? h : "overview"; }
const SKINS = {
  stark:    { name:"Stark Gold",    tag:"Onyx, gold and emerald on a heads-up grid. Pages scan in.", meta:"#050605" },
  vault:    { name:"Emerald Vault", tag:"Private-bank green, champagne gold and art-deco fans. Pages fade in like a vault door.", meta:"#03140d" },
  platinum: { name:"Black Card",    tag:"Platinum, sapphire and rose gold on banknote engraving. Pages glide sideways.", meta:"#06070c" }
};
const ORDER = ["overview","budget","debt","goals","invest","setup"];
const reduceMotion = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : { matches:false };
let lastRoute = null, enterTimer;
function skinKey(){ return SKINS[S.settings.skin] ? S.settings.skin : "stark"; }
function applySkin(){
  const k = skinKey(), root = document.documentElement;
  if (root.dataset.skin === k) return;
  root.dataset.skin = k;
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = SKINS[k].meta;
}
function setSkin(k, ev){
  if (!SKINS[k] || k === skinKey()) return;
  const go = () => { S.settings.skin = k; save(); render(); };
  if (!document.startViewTransition || reduceMotion.matches) return go();
  const root = document.documentElement;
  if (ev && ev.clientX){ root.style.setProperty("--rx", ev.clientX + "px"); root.style.setProperty("--ry", ev.clientY + "px"); }
  root.classList.add("vt-skin");
  quiet(document.startViewTransition(go)).finished.catch(() => {}).then(() => root.classList.remove("vt-skin"));
}
/* A transition can be skipped (another tab tapped mid-animation). That's fine; don't report it as an error. */
function quiet(t){ [t.ready, t.finished, t.updateCallbackDone].forEach(p => p && p.catch(() => {})); return t; }
function revealNav(){
  const nav = document.getElementById("nav"), cur = nav.querySelector("[aria-current]");
  if (!cur || nav.scrollWidth <= nav.clientWidth) return;
  const x = cur.getBoundingClientRect().left - nav.getBoundingClientRect().left + nav.scrollLeft;
  nav.scrollTo({ left: x - (nav.clientWidth - cur.offsetWidth) / 2, behavior: reduceMotion.matches ? "auto" : "smooth" });
}
function render(){
  const r = route();
  applySkin();
  document.querySelectorAll("#nav a").forEach(a => a.getAttribute("href") === "#" + r ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  const v = document.getElementById("view"), changed = r !== lastRoute; lastRoute = r;
  clearTimeout(enterTimer);
  v.classList.toggle("enter", changed && !reduceMotion.matches);
  v.innerHTML = views[r]();
  if (changed){ enterTimer = setTimeout(() => v.classList.remove("enter"), 1000); revealNav(); }
  hud();
  if (r === "setup") loadPhone();
}
function hud(){
  const live = S.holdings.some(h => cached("GLOBAL_QUOTE", h.symbol));
  const fx = fxCached();
  const syncTxt = MODE === "online"
    ? { connecting:"Connecting…", linked:"Saved to your account", offline:"Offline · saved here", device:"This device only", full:"Account storage full" }[sync]
    : { local:"This device only", connecting:"Linking…", linked:"Synced with PC", offline:"PC offline · saved here", denied:"Access key needed" }[sync];
  let mkt = navigator.onLine === false ? "Offline" : live ? "Online" : "Standby";
  if (MODE === "online"){
    const ts = Object.entries(C).filter(([k]) => k.startsWith("GLOBAL_QUOTE:")).map(([, v]) => v.t || 0);
    mkt = ts.length ? "Snapshot " + new Date(Math.max(...ts)).toLocaleDateString(undefined, { day:"numeric", month:"short" }) : "Manual";
  }
  document.getElementById("hud").innerHTML =
    `<span><i class="dot ${live && MODE !== "online" ? "" : "off"}"></i>Market data <b>${mkt}</b></span>` +
    `<span><i class="dot ${sync === "linked" ? "" : "off"}"></i>Sync <b>${syncTxt}</b></span>` +
    `<span>Currency <b>${esc(S.settings.currency)}</b>${fx && S.settings.currency !== "USD" ? ` · 1 USD = <b>${fx.toFixed(2)}</b>` : ""}</span>` +
    `<button class="skin-next" data-skin-next title="Switch look">◐ <b>${SKINS[skinKey()].name}</b></button>` +
    `<span class="clock" id="clock"></span>`;
  tick();
}
function tick(){ const c = document.getElementById("clock"); if (c) c.textContent = new Date().toLocaleString(undefined, {weekday:"short", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit", second:"2-digit"}); }
setInterval(tick, 1000);
window.addEventListener("hashchange", () => {
  document.documentElement.dataset.dir = ORDER.indexOf(route()) < ORDER.indexOf(lastRoute) ? "back" : "fwd";
  const run = () => { render(); window.scrollTo(0,0); };
  if (document.startViewTransition && !reduceMotion.matches) quiet(document.startViewTransition(run)); else run();
});

const view = document.getElementById("view");
view.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.c){ const item = S[el.dataset.c].find(x => x.id === el.dataset.id); if (!item) return;
    item[el.dataset.f] = el.type === "number" ? num(el.value) : (el.dataset.f === "symbol" ? el.value.trim().toUpperCase() : el.value); }
  else if (el.dataset.root){ S[el.dataset.root] = num(el.value); }
  else if (el.dataset.set){ S.settings[el.dataset.set] = el.type === "number" ? num(el.value) : el.value.trim();
    if (el.dataset.set === "currency") fxRate().then(render); }
  else return;
  save(); render();
});
view.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target, fd = new FormData(f);
  if (f.dataset.act === "contribute"){
    const g = S.goals.find(x => x.id === f.dataset.id); const amt = num(fd.get("amount")); if (!g || !amt) return;
    g.contributions.push({ id:uid(), date: fd.get("date") || todayISO(), amount:amt, note: String(fd.get("note") || "") }); save(); render();
  }
  if (f.dataset.act === "addDiv"){
    const sym = String(fd.get("sym") || "").trim().toUpperCase(), ex = String(fd.get("ex") || "");
    if (!sym || !ex) return;
    S.manualDivs = S.manualDivs || [];
    S.manualDivs.push({ id:uid(), sym, ex, pay:String(fd.get("pay") || ""), amount:num(fd.get("amount")) });
    save(); render();
  }
  if (f.dataset.act === "lookup"){
    const sym = String(fd.get("sym")).trim().toUpperCase(); if (!sym) return;
    lookup = { sym, err:"", loading:true }; render();
    try { await av("DIVIDENDS", sym); try { await av("GLOBAL_QUOTE", sym); } catch(_){} } catch(err){ lookup.err = err.message; }
    lookup.loading = false; render();
  }
});
view.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "FORM") return;
  const a = b.dataset.act;
  const add = (c, o) => { S[c].push(Object.assign({id:uid()}, o)); save(); render(); };
  if (a === "del"){ S[b.dataset.c] = (S[b.dataset.c] || []).filter(x => x.id !== b.dataset.id); save(); render(); }
  if (a === "delContrib"){ const g = S.goals.find(x => x.id === b.dataset.g); g.contributions = g.contributions.filter(c => c.id !== b.dataset.id); save(); render(); }
  if (a === "addIncome") add("income", {name:"New income", amount:0});
  if (a === "addExpense") add("expenses", {name:"New category", kind:"need", budget:0, spent:0});
  if (a === "addDebt") add("debts", {name:"New debt", balance:0, apr:0, minPay:0});
  if (a === "addGoal") add("goals", {name:"New goal", target:1000, deadline:new Date(Date.now()+365*86400000).toISOString().slice(0,10), contributions:[]});
  if (a === "addHolding") add("holdings", {symbol:"", shares:0});
  if (a === "addLookup"){ add("holdings", {symbol:lookup.sym, shares:1}); }
  if (a === "strategy"){ S.strategy = b.dataset.v; save(); render(); }
  if (a === "useLeft"){ S.settings.invMonthly = Math.round(totals().left); save(); render(); }
  if (a === "startFresh" || a === "reset"){ const keep = S.settings; S = blankState(); S.settings = keep; save(); render(); }
  if (a === "askReset"){ document.getElementById("confirmReset").hidden = false; }
  if (a === "loadSample"){ const keep = S.settings; S = sampleState(); S.settings = keep; save(); render(); }
  if (a === "export"){ const txt = JSON.stringify(Object.assign({}, S, { market: trimMarket() })); const box = document.getElementById("importBox"); const msg = document.getElementById("ioMsg");
    try { await navigator.clipboard.writeText(txt); msg.textContent = "Backup copied. Paste it somewhere safe."; }
    catch(_){ box.value = txt; box.select(); msg.textContent = "Copy the selected text above."; } }
  if (a === "import"){ const msg = document.getElementById("ioMsg");
    try { const d = JSON.parse(document.getElementById("importBox").value); if (!d.settings || !Array.isArray(d.debts)) throw 0;
      if (d.market && typeof d.market === "object"){ C = Object.assign({}, C, d.market); saveCache(); }
      delete d.market; S = d; save(); render(); }
    catch(_){ msg.textContent = "That doesn't look like a Freedom Ledger backup."; } }
  if (a === "refresh"){
    busy = true; mktErr = ""; render();
    const errs = [];
    for (const h of S.holdings.filter(h => h.symbol)){
      for (const fn of ["GLOBAL_QUOTE", "DIVIDENDS"]){ try { await av(fn, h.symbol, true); } catch(err){ errs.push(err.message); } }
    }
    await fxRate();
    busy = false; mktErr = [...new Set(errs)].join(" "); render();
  }
});

/* first load: use cached data, fetch what's missing quietly */
render();
/* Installable phone app: cache the app so it opens with no connection. */
if (MODE === "pwa" && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
window.addEventListener("online", () => { hud(); });
window.addEventListener("offline", () => { hud(); });
if (MODE === "online") cloudInit();
else (async () => {
  await pull();
  await fxRate();
  for (const h of S.holdings.filter(h => h.symbol)){
    for (const fn of ["GLOBAL_QUOTE", "DIVIDENDS"]) if (!cached(fn, h.symbol)) { try { await av(fn, h.symbol); } catch(e){ mktErr = e.message; } }
  }
  render();
})();
</script>
